<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextPlay</title>
<meta name="description" content="Player development for soccer clubs: coach reviews, home drills, player profiles and team chat.">
<meta name="theme-color" content="#14213a">
<link rel="icon" href="brand/mark-small.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Outfit:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: slim top bar + one working column; coach goes roster -> player, family lands on one child's page */
  --ink:#14213a;
  --paper:#f3f5f8;
  --surface:#ffffff;
  --line:#d2dcee;
  --muted:#1f2b3d;
  --accent:#d9572a;
  --accent-ink:#ffffff;
  --blue:#1f5fc9; --blue-deep:#16449a; --blue-soft:#e4ecfb;
  --pitch:var(--blue);
  --pitch-soft:var(--blue-soft);
  --chip:#eaf0fa;
  --good:#1f5fc9; --warn:#c2410c; --bad:#b42318;
  --good-soft:#e4ecfb; --warn-soft:#fde9dc; --bad-soft:#fbe3df;
  --input-bg:#f5f8fe; --input-line:#bfd0ee;
  --up:#1d7a46; --up-soft:#e2f3e8; --down:#b42318; --down-soft:#fbe3df;
  --shadow:0 1px 2px rgba(20,33,58,.06),0 4px 14px rgba(20,33,58,.05);
  --field-a:#74c47f; --field-b:#66ba72; --field-lines:.85; --eyebrow:#14213a; --card-muted:#4f5b70;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --field-a:#134a2b; --field-b:#175431; --field-lines:.12; --eyebrow:#e7ecf3; --card-muted:#9aa7bb; --ink:#e7ecf3; --paper:#0f1522; --surface:#172033; --line:#2a3650; --muted:#cfd7e2;
    --accent:#f0763f; --accent-ink:#1a0d06; --blue:#6ea4ff; --blue-deep:#9cc0ff; --blue-soft:#1a2c4f; --pitch:#6ea4ff; --pitch-soft:#1a2c4f; --chip:#1f2c47;
    --good:#6ea4ff; --warn:#f59a5f; --bad:#f08470; --good-soft:#1a2c4f; --warn-soft:#3d2414; --bad-soft:#3d1f1a; --input-bg:#111c31; --input-line:#2e4673; --up:#4cc488; --up-soft:#173a2a; --down:#f08470; --down-soft:#3d1f1a;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --field-a:#134a2b; --field-b:#175431; --field-lines:.12; --eyebrow:#e7ecf3; --card-muted:#9aa7bb; --ink:#e7ecf3; --paper:#0f1522; --surface:#172033; --line:#2a3650; --muted:#cfd7e2;
  --accent:#f0763f; --accent-ink:#1a0d06; --blue:#6ea4ff; --blue-deep:#9cc0ff; --blue-soft:#1a2c4f; --pitch:#6ea4ff; --pitch-soft:#1a2c4f; --chip:#1f2c47;
  --good:#6ea4ff; --warn:#f59a5f; --bad:#f08470; --good-soft:#1a2c4f; --warn-soft:#3d2414; --bad-soft:#3d1f1a; --input-bg:#111c31; --input-line:#2e4673; --up:#4cc488; --up-soft:#173a2a; --down:#f08470; --down-soft:#3d1f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--field-a);background-image:repeating-linear-gradient(90deg,var(--field-a) 0 90px,var(--field-b) 90px 180px);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
/* soccer field behind every page: mowed stripes (body) + pitch markings (fixed layer) */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--field-lines);background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1050 680%22 preserveAspectRatio=%22xMidYMid slice%22%3E%3Cg fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%224%22%3E%0A%3Crect x=%2225%22 y=%2225%22 width=%221000%22 height=%22630%22/%3E%3Cline x1=%22525%22 y1=%2225%22 x2=%22525%22 y2=%22655%22/%3E%3Ccircle cx=%22525%22 cy=%22340%22 r=%2291.5%22/%3E%0A%3Crect x=%2225%22 y=%22138.5%22 width=%22165%22 height=%22403%22/%3E%3Crect x=%2225%22 y=%22248.5%22 width=%2255%22 height=%22183%22/%3E%3Cpath d=%22M190 267 A91.5 91.5 0 0 1 190 413%22/%3E%0A%3Crect x=%22860%22 y=%22138.5%22 width=%22165%22 height=%22403%22/%3E%3Crect x=%22970%22 y=%22248.5%22 width=%2255%22 height=%22183%22/%3E%3Cpath d=%22M860 267 A91.5 91.5 0 0 0 860 413%22/%3E%0A%3Cpath d=%22M25 35 A10 10 0 0 0 35 25%22/%3E%3Cpath d=%22M1015 25 A10 10 0 0 0 1025 35%22/%3E%3Cpath d=%22M25 645 A10 10 0 0 1 35 655%22/%3E%3Cpath d=%22M1025 645 A10 10 0 0 0 1015 655%22/%3E%0A%3C/g%3E%3Cg fill=%22%23ffffff%22%3E%3Ccircle cx=%22525%22 cy=%22340%22 r=%225%22/%3E%3Ccircle cx=%22135%22 cy=%22340%22 r=%225%22/%3E%3Ccircle cx=%22915%22 cy=%22340%22 r=%225%22/%3E%3C/g%3E%3C/svg%3E") center/cover no-repeat}
#app,#modal,#toast{position:relative;z-index:1}
/* the page fills at least the screen, so the footer always sits at the bottom */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app>main{flex:1 0 auto;width:100%;box-sizing:border-box}
#app>.site-foot{flex-shrink:0}
#modal,#toast{z-index:20}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2.1rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{background:#14213a;color:#f3f5f8;position:sticky;top:0;z-index:5}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;line-height:1}
.logo-mark{width:38px;height:38px;flex:none;display:block;border-radius:10px}
.top .logo-mark{box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.small-brand .logo-mark{width:30px;height:30px;border-radius:8px}
@media (max-width:420px){.logo-mark{width:32px;height:32px}}
.wordmark{display:inline-flex;align-items:center;gap:0;font-family:"Outfit","Source Sans 3",system-ui,sans-serif;font-weight:700;font-size:1.6rem;letter-spacing:-.015em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.wm-play{color:#f0763f}
.small-brand .wm-play{color:var(--accent)}
.brand svg{flex:none}
.tag{font-family:var(--body);font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 7px;opacity:.7}
.clubname{opacity:.75;font-size:.92rem}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{white-space:nowrap;background:none;border:0;color:inherit;opacity:.78;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
nav.tabs button:hover{opacity:1;background:rgba(255,255,255,.08)}
nav.tabs button[aria-current="page"]{opacity:1;background:var(--accent);color:var(--accent-ink)}

main{max-width:1120px;margin:0 auto;padding:24px 20px 80px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent;padding:6px 8px;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.875rem}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:var(--chip);color:var(--muted)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:.875rem;font-weight:500}
.chip.str{background:var(--good-soft);color:var(--good)}
.chip.imp{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* tiles */
.tile .big{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.tile .lbl{color:var(--muted);font-size:.875rem;margin-top:4px}

/* roster table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
td .pname{font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:.875rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ratings */
.rgroup{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:6px}
.rate{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 70px;gap:10px;align-items:center;font-size:.94rem}
.bar{height:10px;background:var(--chip);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pitch);border-radius:999px}
.delta{font-size:.8rem;font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}
.score{font-family:var(--display);font-weight:700;font-size:1.15rem}

.overall{display:flex;align-items:baseline;gap:8px}
.overall .big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1}

/* player header */
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--pitch);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-weight:700;flex:none}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.12em;background:var(--chip);padding:2px 8px;border-radius:6px}

.note{border-left:4px solid var(--accent);padding:10px 14px;background:var(--chip);border-radius:0 8px 8px 0}

/* drills */
.drill{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.drill summary{cursor:pointer;font-weight:600;color:var(--pitch)}
.drill ol{margin:6px 0 0;padding-left:20px}
.drill li{margin:3px 0}
.dmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

.progress{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;flex:1;min-width:80px}
.progress i{display:block;height:100%;background:var(--accent)}

.locked{border:2px dashed var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* plans */
.plan{display:flex;flex-direction:column;gap:12px}
.plan .price{font-family:var(--display);font-size:2.2rem;font-weight:700}
.plan ul{margin:0;padding-left:20px}
.plan li{margin:4px 0}
.plan.featured{border:2px solid var(--accent)}

/* chart */
.chart svg{width:100%;height:auto;display:block}

/* forms & modal */
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px;font-weight:400;width:100%}
textarea{min-height:80px;resize:vertical}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-weight:400}
.choice:has(input:checked){border-color:var(--accent);background:var(--chip)}
.chipbox{position:relative;cursor:pointer}
.chipbox input{position:absolute;opacity:0;pointer-events:none}
.chipbox span{display:inline-block;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:.875rem;font-weight:500}
.chipbox input:checked + span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chipbox input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.slider{display:grid;grid-template-columns:1fr 150px 32px;gap:10px;align-items:center;font-size:.94rem}
.slider output{font-family:var(--display);font-weight:700;font-size:1.2rem;text-align:right}
input[type=range]{accent-color:var(--accent);width:100%}
.backdrop{position:fixed;inset:0;background:rgba(10,16,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:14px;max-width:620px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal form{display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-weight:600;z-index:30;box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.list > div{padding:10px 0;border-bottom:1px solid var(--line)}
.list > div:last-child{border-bottom:0}
.back{align-self:flex-start}
@media (prefers-reduced-motion:no-preference){.btn,.filters button{transition:background .15s,border-color .15s}}

/* profile */
.subtabs{display:flex;gap:2px;border-bottom:2px solid var(--line)}
.subtabs button{background:none;border:0;padding:10px 16px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
@media (max-width:560px){.pcard{grid-template-columns:1fr}}
.photo{width:132px;height:132px;border-radius:14px;object-fit:cover;background:var(--chip);display:block}
.photo.ph{display:grid;place-items:center;font-family:var(--display);font-size:3rem;font-weight:700;color:#fff;background:var(--pitch)}
.photo-wrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.vis{display:inline-flex;align-items:center;gap:6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.vid{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.vid video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.vid .vlink{aspect-ratio:16/9;display:grid;place-items:center;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;padding:12px;text-align:center}
.vid .vbody{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin-left:6px}
.titem{position:relative;padding:4px 0 16px 18px}
.titem::before{content:"";position:absolute;left:-8.5px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--pitch)}
.titem.now::before{background:var(--pitch)}
.ref{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ref.reference{border-left:4px solid var(--pitch)}
.ref blockquote{margin:0;white-space:pre-wrap}
.uploading{font-weight:600;color:var(--accent)}
nav.tabs .signout-link{opacity:.6;font-weight:500;font-size:.9rem}
input[type=email],input[type=password]{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px;font-weight:400;width:100%}

/* team chat */
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;margin-left:6px;font-family:var(--body)}
nav.tabs button[aria-current="page"] .badge{background:var(--paper);color:var(--ink)}
.chat{display:grid;grid-template-columns:240px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;height:calc(100vh - 190px);min-height:440px}
.chat-side{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;background:var(--paper)}
.chat-side h3{padding:14px 16px 6px;font-size:.8rem;font-family:var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chat-side button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:11px 16px;cursor:pointer;border-left:3px solid transparent}
.chat-side button:hover{background:var(--chip)}
.chat-side button[aria-current="true"]{background:var(--surface);border-left-color:var(--accent);font-weight:700}
.chat-side .tn{display:flex;flex-direction:column}
.chat-side .tp{font-size:.8rem;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.chat-main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.chat-head{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chat-pick{display:none}
.thread{flex:1;min-height:0;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font-size:.78rem;font-weight:700;color:var(--muted);background:var(--chip);padding:2px 10px;border-radius:999px;margin:6px 0}
.msg{display:flex;flex-direction:column;gap:2px;max-width:78%;align-self:flex-start;position:relative}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.bubble{background:var(--chip);padding:9px 13px;border-radius:14px 14px 14px 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine .bubble{background:var(--pitch);color:#fff;border-radius:14px 14px 4px 14px}
.msg .del{opacity:0;font-size:.78rem;position:absolute;bottom:2px;right:0;transform:translateX(100%)}
.msg.mine .del{right:auto;left:0;transform:translateX(-100%)}
.announce .del{position:absolute;bottom:8px;right:10px;transform:none}
.msg:hover .del,.msg:focus-within .del{opacity:1}
.announce{align-self:stretch;max-width:none;border:1px solid var(--accent);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--surface);gap:6px}
.announce .bubble{background:none;padding:0;color:var(--ink)!important;border-radius:0}
.pinned{padding:10px 18px;border-bottom:1px solid var(--line);background:var(--warn-soft);color:var(--ink);font-size:.92rem;display:flex;gap:8px;align-items:baseline}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:44px;max-height:160px;resize:none}
.composer .row{justify-content:space-between}
@media (max-width:720px){
  .chat{grid-template-columns:1fr;height:calc(100vh - 230px)}
  .chat-side{display:none}
  .chat-pick{display:block;max-width:240px}

}

/* sign-in entrances */
.portals{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.portal{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:14px;padding:26px 24px;box-shadow:var(--shadow);min-height:230px}
.portal.family{border-top-color:var(--pitch)}
.portal:hover{border-color:var(--muted);border-top-color:var(--accent)}
.portal.family:hover{border-top-color:var(--pitch)}
.portal .picon{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;background:var(--chip);color:var(--accent)}
.portal.family .picon{color:var(--pitch)}
.portal .ptitle{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1}
.portal .pdesc{color:var(--muted);max-width:42ch}

form.auth-family{border-top:5px solid var(--pitch)}
form.auth-family .btn.primary{background:var(--pitch);border-color:var(--pitch);color:#fff}

/* review timeline */
.tl{display:flex;flex-direction:column;border-left:3px solid var(--line);margin-left:6px}
.tl-item{position:relative;padding:4px 0 18px 18px;display:flex;flex-direction:column;gap:6px}
.tl-item::before{content:"";position:absolute;left:-8.5px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl-item:first-child::before{background:var(--accent)}
.tl-sum{font-weight:600;margin:0}
.progress-sum{background:var(--chip);border-radius:10px;padding:14px}
.update-box{background:var(--chip);border-radius:10px;padding:12px}
details summary{cursor:pointer;color:var(--pitch);font-weight:600}

/* front-page example */
.example{margin-top:28px;padding-top:28px;border-top:2px dashed var(--line)}
.example h3{font-size:1.3rem}

/* recommendations */
.rec-card{border-top:5px solid var(--pitch)}
.rec-why{background:var(--pitch-soft);color:var(--ink);border-radius:8px;padding:8px 10px}
.trains{color:var(--ink)}

/* public site menu */
a.brand{color:inherit;text-decoration:none}
.site-nav{display:flex;align-items:center;gap:2px;margin-left:auto;flex-wrap:wrap}
.site-nav .navlink{color:inherit;text-decoration:none;opacity:.8;padding:8px 10px;border-radius:8px;font-weight:600;white-space:nowrap}
.site-nav .navlink:hover{opacity:1;background:rgba(255,255,255,.08)}
.site-nav .navlink[aria-current="page"]{opacity:1;box-shadow:inset 0 -3px 0 var(--accent);border-radius:0}
.site-nav .nav-signin{margin-left:8px;text-decoration:none}
.menu-btn{display:none;margin-left:auto;background:transparent;color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}

@media (max-width:980px){
  .menu-btn{display:inline-block}
  .site-nav{display:none;width:100%;flex-direction:column;align-items:stretch;gap:0;padding:6px 0 10px}
  .site-nav.open{display:flex}
  .site-nav .navlink{padding:12px 6px;border-bottom:1px solid rgba(255,255,255,.08);border-radius:0}
  .site-nav .navlink[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent);padding-left:12px}
  .site-nav .nav-signin{margin:12px 0 0;justify-content:center}
}
/* public pages */
.page-hero{gap:10px;max-width:760px;padding:12px 0 6px}
.eyebrow{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--eyebrow);border-left:4px solid var(--accent);padding-left:8px;align-self:flex-start}
.page-hero h1{font-size:2.6rem}
.lead{font-size:1.15rem;color:var(--muted);max-width:62ch}
.feature h3{font-size:1.25rem}
.step{display:flex;gap:14px;align-items:flex-start}
.step-n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.cta-row{justify-content:center;gap:12px;padding:8px 0}
.callout{border-left:5px solid var(--pitch)}
ol.numbered{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.faq{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.faq:last-child{border-bottom:0}
.faq a{color:var(--accent);font-weight:600}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.site-foot{border-top:1px solid var(--line);background:var(--surface);margin-top:20px}
.foot-in{max-width:1120px;margin:0 auto;padding:22px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.foot-in nav{display:flex;gap:14px;flex-wrap:wrap}
.foot-in nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem}
.foot-in nav a:hover{color:var(--ink)}
.small-brand{color:var(--ink)}
.small-brand .wordmark{font-size:1.25rem}

/* illustrated example headshot */
.avatar-art{padding:0;overflow:hidden;background:#16408f;flex:none}
.avatar-art svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){
  .gp-eyes{transform-box:view-box;transform-origin:100px 93px;animation:gp-blink 5.5s infinite}
  @keyframes gp-blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
}

/* text on white surfaces keeps the softer grey; text straight on the grass uses the darker one */
.card,.modal,.drill,.portal,.chat,.site-foot,.locked,.ref,.vid,.banner,.toast{--muted:var(--card-muted)}
.locked{background:var(--surface);border-color:var(--card-muted)}

/* drill paywall */
.paywall{border-top:5px solid var(--accent)}
.paywall-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--chip);border-radius:8px;padding:8px 10px;font-size:.9rem;font-weight:600}
.paywall-line a.btn{text-decoration:none}

a.btn{text-decoration:none;color:var(--ink)}

/* private messages & meeting room */
.pm-tabs{padding:0 14px;border-bottom:1px solid var(--line)}

.meetings{padding:16px 18px;overflow-y:auto;flex:1;min-height:0}
.meeting-card{display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font:inherit;color:inherit}

.meeting-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--chip);border-radius:10px;padding:10px 12px}
@media (max-width:720px){.meeting-facts{grid-template-columns:1fr}}
.review-mini{border:1px solid var(--line);border-left:4px solid var(--pitch);border-radius:10px;padding:10px 12px}

/* public / private switch */
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--card-muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,33,58,.18)}
.seg button.on[data-v="public"]{background:var(--pitch);color:#fff}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.limited-profile{max-width:640px}

/* keep the signed-in menu on one row */
.top-in{flex-wrap:nowrap}
.clubname{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem}
nav.tabs{flex-wrap:nowrap}
nav.tabs button{padding:8px 10px}
nav.tabs .signout-link{padding:8px 8px}
@media (max-width:1180px){ .clubname{display:none} }
@media (max-width:980px){ .top-in{flex-wrap:wrap} nav.tabs{flex-wrap:wrap;margin-left:0;width:100%} }

/* signed-in menu on phones */
.app-menu-btn{display:none}
@media (max-width:980px){
  .app-menu-btn{display:inline-flex;align-items:center;gap:6px}

  nav.app-tabs.open{display:flex}

  nav.app-tabs button[aria-current="page"]{background:transparent;color:inherit;box-shadow:inset 3px 0 0 var(--accent);padding-left:12px}
}

/* drill library dropdowns */
.lib-tools{align-items:flex-end;gap:12px}
.search-f{flex:1;min-width:240px;max-width:560px}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:400;width:100%}
.lib-note{margin-top:-6px}
.skill-group{display:flex;flex-direction:column;gap:8px}
.sg-title{font-size:1.15rem;margin-top:6px}
.skill-dd{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);--muted:var(--card-muted)}
.skill-dd > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;color:var(--ink);font-weight:700}
.skill-dd > summary::-webkit-details-marker{display:none}
.skill-dd > summary:hover{background:var(--chip);border-radius:12px}
.skill-dd[open] > summary{border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.sk-name{font-family:var(--display);font-size:1.15rem}
.sk-count{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--card-muted);background:var(--chip);padding:3px 10px;border-radius:999px}
.chev{width:10px;height:10px;border-right:2.5px solid var(--card-muted);border-bottom:2.5px solid var(--card-muted);transform:rotate(45deg);margin:0 4px 4px 2px;flex:none}
.skill-dd[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .15s}}
.skill-dd .dgrid{padding:14px}

/* ---- orange & blue interface ---- */
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=search],input[type=datetime-local],select,textarea{
  background:var(--input-bg);border:1.5px solid var(--input-line);border-radius:10px;color:var(--ink)}
input[type=text]:hover,input[type=number]:hover,input[type=date]:hover,input[type=email]:hover,input[type=password]:hover,input[type=search]:hover,input[type=datetime-local]:hover,select:hover,textarea:hover{border-color:var(--blue)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,87,42,.18);background:var(--surface)}
label.f{color:var(--blue-deep)}
.card,.skill-dd,.drill,.meeting-card,.chat{border-color:var(--line)}
.card{border-top:3px solid var(--blue)}
.card.paywall,.card.rec-card,.card.plan.featured,.portal,.chat .card{border-top-width:5px}
.btn{border:1.5px solid var(--blue);color:var(--blue-deep);background:var(--surface)}
.btn:hover{background:var(--blue-soft);border-color:var(--blue)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#c24c22;border-color:#c24c22}
.btn.ghost{border-color:transparent;color:var(--blue-deep);background:none}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
a.btn{color:var(--blue-deep)}
a.btn.primary{color:var(--accent-ink)}
.chip{background:var(--blue-soft);color:var(--blue-deep)}
.chip.str{background:var(--blue-soft);color:var(--blue)}
.chip.imp{background:var(--warn-soft);color:var(--warn)}
.pill.plain{background:var(--blue-soft);color:var(--blue-deep)}
.filters button{border:1.5px solid var(--input-line);color:var(--blue-deep)}
.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chipbox span{border:1.5px solid var(--input-line);color:var(--blue-deep);background:var(--surface)}
.chipbox input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff}
.choice{border:1.5px solid var(--input-line)}
.choice:has(input:checked){border-color:var(--accent);background:var(--warn-soft)}
.subtabs{border-bottom-color:var(--input-line)}
.subtabs button[aria-selected="true"]{color:var(--blue-deep)}
.rgroup,.sg-title{color:var(--blue-deep)}
.note{border-left-color:var(--accent);background:var(--blue-soft)}
.bar{background:var(--blue-soft)}
.progress{background:var(--blue-soft)}
.msg.mine .bubble{background:var(--blue)}
.bubble{background:var(--blue-soft)}
.day{background:var(--blue-soft);color:var(--blue-deep)}
.sk-count{background:var(--blue-soft);color:var(--blue-deep)}
.skill-dd > summary:hover{background:var(--blue-soft)}
.chat-side{background:var(--blue-soft)}
.chat-side button[aria-current="true"]{border-left-color:var(--accent)}
.progress-sum,.update-box,.meeting-facts,.paywall-line{background:var(--blue-soft)}
.seg{background:var(--blue-soft);border-color:var(--input-line)}
.seg button.on[data-v="public"]{background:var(--blue)}
.tile .big{color:var(--blue-deep)}
.avatar,.photo.ph{background:var(--blue)}
/* improvements green, declines red */
.delta.up{color:var(--up)}
.delta.down{color:var(--down)}
.chip.up{background:var(--up-soft);color:var(--up)}

input[type=range]:focus{box-shadow:none;background:none;border:0}

/* join requests & team search */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

.club-results{max-height:46vh;overflow:auto}
p.composer{padding:12px 0}
.modal form.search-row,.search-row{display:flex;flex-direction:row;gap:10px;align-items:flex-end;flex-wrap:wrap}

p.picked{margin:0;padding:8px 12px;border-radius:8px;background:var(--blue-soft);color:var(--blue-deep)}
